name: build-fractional-wheel

on:
  push:
    branches: [equity-fractional]
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          pip install numpy cython==3.2.9 setuptools packaging
      - name: Build
        env:
          CARGO_BUILD_JOBS: 4
          BUILD_MODE: release
        run: python build.py
      - name: Wheel
        run: |
          pip install poetry-core build
          python -m build --wheel --outdir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-fractional-wheel
          path: dist/*.whl
