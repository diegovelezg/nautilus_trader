name: build-fractional-wheel

on:
  push:
    branches: [equity-fractional]
    tags: ['v*frac*']
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          pip install numpy cython==3.2.9 setuptools packaging
      - name: Build
        env:
          CARGO_BUILD_JOBS: 4
          BUILD_MODE: release
        run: python build.py
      - name: Wheel
        run: |
          pip install poetry-core
          pip wheel . --no-build-isolation --wheel-dir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-fractional-wheel
          path: dist/*.whl
      - name: Release (solo en tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/nautilus_trader-*.whl --title "${GITHUB_REF_NAME}" --notes "Wheel Equity fraccionario (ADR-004). cp312 linux_x86_64."
